[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molsteer"
version = "0.1.0"
description = "Evidence-bound molecular diagnosis, reward reasoning and offline control validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "rdkit>=2024.3", "jsonschema>=4,<5",
    "langchain>=1.0,<2", "langgraph>=1.0,<2", "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2.7,<3",
    "markdown-it-py>=3,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
evaluation = ["scipy>=1.10", "meeko>=0.8", "vina>=1.2"]

[project.scripts]
molsteer = "molsteer.cli:main"
molreader = "molreader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molreader = ["configs/*.json", "schemas/*.json"]
"molsteer.reporting" = ["templates/*.html"]
